services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sot
      POSTGRES_PASSWORD: sot_password
      POSTGRES_DB: shotontarget
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
  redis:
    image: redis:7
  api:
    build: ./backend
    env_file: .env
    volumes:
      - ./media:/media
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    command: uvicorn app.main:api --host 0.0.0.0 --port 8000
  worker:
    build: ./backend
    env_file: .env
    volumes:
      - ./media:/media
    depends_on:
      - db
      - redis
    command: celery -A app.worker worker -l info
  beat:
    build: ./backend
    env_file: .env
    depends_on:
      - redis
    command: celery -A app.worker beat -l info
volumes:
  pgdata:
